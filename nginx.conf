# Nginx configuration for Mozartify Frontend (SPA)
# Serves the Vite built application with SPA routing

server {
  listen 5173;
  server_name _;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json;
  gzip_min_length 1000;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Root directory
  root /usr/share/nginx/html;

  # Reverse proxy API requests to backend service.
  # Without this, POST /api/* can be handled as a static route and return 405.
  location /api/ {
    proxy_pass http://backend:10000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Handle /api without trailing slash.
  location = /api {
    return 301 /api/;
  }

  # SPA fallback: route all requests to index.html except for static assets
  location / {
    try_files $uri $uri/ /index.html;
    
    # Cache control: no cache for index.html
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
  }

  # Static assets with long cache (images, css, js bundles)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000";
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
