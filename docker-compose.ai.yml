services:
  genre-ai:
    build:
      context: ./fastapi-server
      dockerfile: Dockerfile
    container_name: mozartify-genre-ai
    restart: unless-stopped
    ports:
      - "${AI_BIND_ADDRESS:-0.0.0.0}:8001:8001"
    environment:
      SERVICE_MODULE: genre
      PORT: 8001
      TF_ENABLE_ONEDNN_OPTS: "0"
    platform: linux/amd64

  emotion-ai:
    build:
      context: ./fastapi-server
      dockerfile: Dockerfile
    container_name: mozartify-emotion-ai
    restart: unless-stopped
    ports:
      - "${AI_BIND_ADDRESS:-0.0.0.0}:8002:8002"
    environment:
      SERVICE_MODULE: emotion
      PORT: 8002
      TF_ENABLE_ONEDNN_OPTS: "0"
    platform: linux/amd64

  gender-ai:
    build:
      context: ./fastapi-server
      dockerfile: Dockerfile
    container_name: mozartify-gender-ai
    restart: unless-stopped
    ports:
      - "${AI_BIND_ADDRESS:-0.0.0.0}:8003:8003"
    environment:
      SERVICE_MODULE: gender
      PORT: 8003
      TF_ENABLE_ONEDNN_OPTS: "0"
    platform: linux/amd64